<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Look, say, cover, write, check spelling practice for Years 1 to 6.">
<title>emeejay Spelling Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@600;700&family=Caveat+Brush&family=Petit+Formal+Script&family=Nunito:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#1A1033; --card:#2A1D4A; --card-2:#32245A; --line:#3E2F68;
  --lilac:#C8A6FF; --lilac-dim:#9B7FD4; --text:#F1EAFF; --muted:#B3A4D4;
  --green:#4FBF85; --green-bg:#1B3A2C; --amber:#E39A3F; --amber-bg:#3A2A18;
  --y1:#3C5ADC; --y2:#2E9E63; --y3:#7C4DCD; --y4:#D87704; --y5:#3F7CAB; --y6:#C2245E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:Nunito,"Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
.wrap{min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:14px 22px;max-width:1120px;margin:0 auto;width:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:3px;border-radius:6px}
a{color:var(--lilac)}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:42px;height:42px;flex:0 0 42px;border-radius:11px;display:block}
.brand .mj{font-family:"Caveat Brush",Nunito,cursive;font-size:29px;line-height:1;color:var(--lilac);letter-spacing:.01em}
.brand .pg{font-size:13px;color:var(--muted);margin-top:2px}
.method{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--lilac-dim);white-space:nowrap}

/* setup */
.lede{max-width:64ch;margin:0 0 22px;color:var(--muted);font-size:15.5px}
.lede b{color:var(--text);font-weight:700}
h2.sec{font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--lilac-dim);margin:0 0 11px;font-weight:700}
.years{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}
.yr{padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-weight:600}
.yr[aria-pressed="true"]{border-color:transparent;color:#fff}
.yr[data-y="Year 1"][aria-pressed="true"]{background:var(--y1)}
.yr[data-y="Year 2"][aria-pressed="true"]{background:var(--y2)}
.yr[data-y="Year 3"][aria-pressed="true"]{background:var(--y3)}
.yr[data-y="Year 4"][aria-pressed="true"]{background:var(--y4)}
.yr[data-y="Year 5"][aria-pressed="true"]{background:var(--y5)}
.yr[data-y="Year 6"][aria-pressed="true"]{background:var(--y6)}

.patterns{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px;margin-bottom:22px}
.pat{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;
  display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);color:var(--text)}
.pat:hover{border-color:var(--lilac-dim);background:var(--card-2)}
.pat .pn{font-weight:700;font-size:15.5px;line-height:1.3}
.pat .pw{font-family:Andika,Nunito,sans-serif;font-size:13.5px;color:var(--muted);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pat .pc{font-size:12px;color:var(--lilac);font-weight:600;letter-spacing:.03em}

.tiers{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--lilac);border-color:var(--lilac);color:var(--ink)}

#weekPicker{font-family:Andika,Nunito,sans-serif;font-size:16px;color:var(--text);background:var(--ink);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:280px;max-width:100%}

.own{background:var(--card);border:1.5px dashed var(--lilac-dim);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.own h3{margin:0 0 5px;font-size:17px;font-weight:700}
.own p{margin:0 0 14px;font-size:14.5px;color:var(--muted)}
.own label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.own input,.own textarea{width:100%;font-family:Andika,Nunito,sans-serif;font-size:16px;color:var(--text);
  background:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.own textarea{min-height:84px;resize:vertical;line-height:1.6}
.own input::placeholder,.own textarea::placeholder{color:#7C6EA0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.go{background:var(--lilac);color:var(--ink);border:none;border-radius:12px;padding:13px 24px;font-weight:700;font-size:16px}
.go:hover{filter:brightness(1.08)}
.go[disabled]{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;color:var(--lilac);border:1.5px solid var(--line);border-radius:12px;padding:12px 20px;font-weight:700}
.ghost:hover{border-color:var(--lilac-dim)}

/* practice */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bar .now{font-size:14px;color:var(--muted)}
.bar .now b{color:var(--text);font-weight:700}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--green)}
.dot.miss{background:var(--amber)}
.dot.now{background:var(--lilac);box-shadow:0 0 0 3px rgba(200,166,255,.22)}
.exit{background:transparent;border:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:4px}

.strip{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.st{flex:1 1 0;min-width:74px;text-align:center;padding:9px 4px;border-radius:10px;background:var(--card);
  border:1.5px solid var(--line);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.st.on{background:var(--lilac);border-color:var(--lilac);color:var(--ink)}
.st.past{background:var(--card-2);border-color:var(--lilac-dim);color:var(--lilac)}

.stage{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:28px 18px;min-height:250px;text-align:center;gap:22px}
.word{font-family:Andika,Nunito,sans-serif;font-weight:700;line-height:1.1;color:var(--text);
  font-size:clamp(46px,12vw,116px);word-break:break-word;max-width:100%;margin-bottom:0;padding-bottom:.35em}
.word.joined{font-family:'Petit Formal Script',cursive;font-weight:400;line-height:1.3;letter-spacing:.005em}
.word em{font-style:normal;color:var(--lilac);position:relative}
.word em::after{content:'';position:absolute;left:0;right:0;bottom:-.16em;height:.07em;background:var(--lilac-dim);border-radius:2px}
.cue{font-size:clamp(15px,2.2vw,19px);color:var(--muted);max-width:44ch;margin:0}
.cue b{color:var(--text);font-weight:700}
.covered{width:min(420px,88%);aspect-ratio:5/2;border-radius:18px;background:var(--card-2);border:2px dashed var(--lilac-dim);
  display:flex;align-items:center;justify-content:center;color:var(--lilac);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;font-size:14px}
.lines{width:min(520px,94%);display:flex;flex-direction:column;gap:26px;padding:8px 0}
.lines i{display:block;height:0;border-bottom:3px solid var(--line);border-radius:2px}
.typebox{width:min(520px,94%);font-family:Andika,Nunito,sans-serif;font-size:clamp(28px,6vw,48px);
  text-align:center;color:var(--text);background:var(--card-2);border:2px solid var(--lilac-dim);
  border-radius:14px;padding:14px 18px}
.hear{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--muted);font-size:14px;font-weight:600}
.hear:hover{border-color:var(--lilac-dim);color:var(--lilac)}

.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.actions button{flex:1 1 180px}
.big{border:none;border-radius:14px;padding:18px 22px;font-weight:700;font-size:18px;background:var(--lilac);color:var(--ink)}
.big:hover{filter:brightness(1.08)}
.yes{background:var(--green-bg);color:var(--green);border:2px solid var(--green)}
.no{background:var(--amber-bg);color:var(--amber);border:2px solid var(--amber)}
.hint{text-align:center;font-size:12.5px;color:var(--muted);margin-top:11px}

/* results */
.score{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tile{flex:1 1 150px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.tile .n{font-size:36px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--lilac)}
.tile .l{font-size:13px;color:var(--muted);margin-top:5px}
.tile.ok .n{color:var(--green)}
.tile.again .n{color:var(--amber)}
.wordlist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.wordlist span{font-family:Andika,Nunito,sans-serif;font-size:18px;padding:7px 14px;border-radius:10px;
  background:var(--amber-bg);color:var(--amber);border:1.5px solid var(--amber)}
.wordlist span.ok{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.note{font-size:14px;color:var(--muted);margin:0 0 18px;max-width:60ch}

footer{margin-top:26px;padding-top:15px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);
  display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
footer .tag{font-family:"Caveat Brush",Nunito,cursive;font-size:19px;color:var(--lilac)}
[hidden]{display:none!important}
</style>
</head>
